spring:
  application:
    name: routepay-api

  # Default: H2 in-memory for development
  datasource:
    url: jdbc:h2:mem:routepay;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

# RoutePay-specific config
routepay:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-in-prod!!}
    expiration-ms: 86400000  # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:19006,http://localhost:3000,http://localhost:3001,http://localhost:3002}
  momo:
    env: mock  # mock | sandbox | production

# MoMo SDK config (maps to MoMoProperties)
momo:
  environment: MOCK
  subscription-key: ${MOMO_SUBSCRIPTION_KEY:mock-subscription-key}
  callback-url: ${MOMO_CALLBACK_URL:https://example.com/callback}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

---
# Production profile
spring:
  config:
    activate:
      on-profile: production

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:routepay}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:routepay}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate

  h2:
    console:
      enabled: false

momo:
  environment: PRODUCTION
  subscription-key: ${MOMO_SUBSCRIPTION_KEY}
  api-user: ${MOMO_API_USER}
  api-key: ${MOMO_API_KEY}
  primary-key: ${MOMO_PRIMARY_KEY}
