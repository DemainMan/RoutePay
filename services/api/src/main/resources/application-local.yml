# Local development profile — enables H2 console and Swagger UI
spring:
  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    url: jdbc:h2:mem:routepay;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

routepay:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-minimum-32-chars-long!!}
    expiration-ms: 86400000

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:19006,http://localhost:3000,http://localhost:3001,http://localhost:3002}
