spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

routepay:
  jwt:
    secret: test-secret-key-for-unit-tests-only-must-be-long-enough
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:3000,http://localhost:19006

momo:
  environment: MOCK
  subscription-key: mock-key
