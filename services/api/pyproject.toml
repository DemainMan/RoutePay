[project]
name = "routepay-api"
version = "0.1.0"
description = "RoutePay FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.19",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "qrcode[pil]>=7.4",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "momo-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routepay_api"]
