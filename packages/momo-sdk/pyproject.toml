[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "momo-sdk"
version = "0.1.0"
description = "Python SDK for MTN MoMo API — Collections, Disbursements, Remittances, Payments, and Auth"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/momo_sdk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "UP042"]
